identity:
  name: "search-products"
  author: "ryuichi"
  label:
    en_US: "Search products"
    ja_JP: "商品検索"

description:
  human:
    en_US: "Search Shopify products by keyword or Shopify search query"
    ja_JP: "キーワードまたは Shopify 検索クエリで商品を検索します"
  llm: "Search Shopify products by keyword or Shopify search query"

parameters:
  - name: query
    type: string
    required: true
    label:
      en_US: Query
      ja_JP: 検索クエリ
    human_description:
      en_US: "Keyword or Shopify product search query, for example snow or sku:SKU-001"
      ja_JP: "キーワードまたは Shopify の商品検索クエリ。例: snow / sku:SKU-001"
    llm_description: "Keyword or Shopify product search query"
    form: llm

  - name: limit
    type: number
    required: false
    label:
      en_US: Limit
      ja_JP: 最大件数
    human_description:
      en_US: "Maximum number of products to return, from 1 to 20"
      ja_JP: "返す商品の最大件数。1 から 20"
    llm_description: "Maximum number of products to return, between 1 and 20"
    form: llm

extra:
  python:
    source: tools/search-products.py
