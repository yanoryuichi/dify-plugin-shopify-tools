identity:
  name: "remove-product-tags"
  author: "ryuichi"
  label:
    en_US: "Remove product tags"
    ja_JP: "商品タグ削除"

description:
  human:
    en_US: "Remove tags from a Shopify product"
    ja_JP: "Shopify 商品からタグを削除します"
  llm: "Remove tags from a Shopify product"

parameters:
  - name: product_id
    type: string
    required: true
    label:
      en_US: Product ID
      ja_JP: 商品ID
    human_description:
      en_US: "Shopify product ID, for example 1234567890123"
      ja_JP: "Shopify の商品 ID。例: 1234567890123"
    llm_description: "Shopify product ID"
    form: llm

  - name: tags
    type: string
    required: true
    label:
      en_US: Tags
      ja_JP: タグ
    human_description:
      en_US: "Comma-separated tags to remove, for example featured, spring"
      ja_JP: "削除するカンマ区切りタグ。例: featured, spring"
    llm_description: "Comma-separated tags to remove"
    form: llm

extra:
  python:
    source: tools/remove-product-tags.py
