identity:
  name: "search-orders"
  author: "ryuichi"
  label:
    en_US: "Search orders"
    ja_JP: "注文検索"

description:
  human:
    en_US: "Search Shopify orders by keyword or Shopify search query"
    ja_JP: "キーワードまたは Shopify 検索クエリで注文を検索します"
  llm: "Search Shopify orders by keyword or Shopify search query"

parameters:
  - name: query
    type: string
    required: true
    label:
      en_US: Query
      ja_JP: 検索クエリ
    human_description:
      en_US: "Keyword or Shopify order search query, for example name:#1001 or status:open"
      ja_JP: "キーワードまたは Shopify の注文検索クエリ。例: name:#1001 / status:open"
    llm_description: "Keyword or Shopify order search query"
    form: llm

  - name: limit
    type: number
    required: false
    label:
      en_US: Limit
      ja_JP: 最大件数
    human_description:
      en_US: "Maximum number of orders to return, from 1 to 20"
      ja_JP: "返す注文の最大件数。1 から 20"
    llm_description: "Maximum number of orders to return, between 1 and 20"
    form: llm

extra:
  python:
    source: tools/search-orders.py
