identity:
  author: "ryuichi"
  name: "shopify-tools"
  label:
    en_US: "Shopify Tools"
    ja_JP: "Shopify Tools"
  description:
    en_US: "Tools for working with Shopify products, orders, customers, and more"
    ja_JP: "Shopify の商品・注文・顧客などを操作するためのツール"
  icon: "icon.svg"

credentials_for_provider:
  shop_domain:
    type: text-input
    required: true
    label:
      en_US: Shop domain
      ja_JP: ショップドメイン
    placeholder:
      en_US: your-store.myshopify.com
      ja_JP: your-store.myshopify.com
    help:
      en_US: Enter your Shopify shop domain
      ja_JP: Shopify のショップドメインを入力してください

  auth_method:
    type: select
    required: true
    label:
      en_US: Authentication method
      ja_JP: 認証方式
    options:
      - value: access_token
        label:
          en_US: Admin API access token
          ja_JP: Admin API アクセストークン
      - value: client_credentials
        label:
          en_US: Client credentials (Client ID / Client secret)
          ja_JP: Client credentials (Client ID / Client secret)

  admin_api_access_token:
    type: secret-input
    required: false
    label:
      en_US: Admin API access token
      ja_JP: Admin API アクセストークン
    placeholder:
      en_US: shpat_xxx
      ja_JP: shpat_xxx
    help:
      en_US: Required when auth method is "Admin API access token"
      ja_JP: 認証方式が Admin API アクセストークンなら必須

  client_id:
    type: text-input
    required: false
    label:
      en_US: Client ID
      ja_JP: Client ID
    placeholder:
      en_US: 123abcxxx
      ja_JP: 123abcxxx
    help:
      en_US: Required when auth method is "Client credentials"
      ja_JP: 認証方式が Client ID / Client secret なら必須

  client_secret:
    type: secret-input
    required: false
    label:
      en_US: Client secret
      ja_JP: Client secret
    placeholder:
      en_US: shpss_xxx
      ja_JP: shpss_xxx
    help:
      en_US: Required when auth method is "Client credentials"
      ja_JP: 認証方式が Client ID / Client secret なら必須

  api_version:
    type: text-input
    required: true
    label:
      en_US: API version
      ja_JP: API バージョン
    placeholder:
      en_US: 2025-10
      ja_JP: 2025-10
    help:
      en_US: Shopify Admin API version
      ja_JP: Shopify Admin API のバージョン

tools:
  - tools/add-customer-tags.yaml
  - tools/remove-customer-tags.yaml
  - tools/add-order-tags.yaml
  - tools/remove-order-tags.yaml
  - tools/add-product-tags.yaml
  - tools/remove-product-tags.yaml
  - tools/get-customer.yaml
  - tools/search-customers.yaml
  - tools/get-product.yaml
  - tools/get-order.yaml
  - tools/search-orders.yaml
  - tools/search-products.yaml

extra:
  python:
    source: provider/shopify-tools.py
