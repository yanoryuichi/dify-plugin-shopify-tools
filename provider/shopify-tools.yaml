identity:
  author: "ryuichi"
  name: "shopify-tools"
  label:
    en_US: "shopify-tools"
    ja_JP: "shopify-tools"
  description:
    en_US: "Shopify tools for my Dify workflows"
    ja_JP: "Shopify tools for my Dify workflows"
  icon: "icon.svg"

credentials_for_provider:
  shop_domain:
    type: text-input
    required: true
    label:
      en_US: Shop domain
      ja_JP: ショップドメイン
    placeholder:
      en_US: your-store.myshopify.com
      ja_JP: your-store.myshopify.com
    help:
      en_US: Enter your Shopify shop domain
      ja_JP: Shopify の shop domain を入力してください

  admin_api_access_token:
    type: secret-input
    required: true
    label:
      en_US: Admin API access token
      ja_JP: Admin API アクセストークン
    placeholder:
      en_US: shpat_xxx
      ja_JP: shpat_xxx
    help:
      en_US: Enter your Shopify Admin API access token
      ja_JP: Shopify Admin API のアクセストークンを入力してください

  api_version:
    type: text-input
    required: true
    label:
      en_US: API version
      ja_JP: API バージョン
    placeholder:
      en_US: 2025-10
      ja_JP: 2025-10
    help:
      en_US: Shopify Admin API version
      ja_JP: Shopify Admin API のバージョン

tools:
  - tools/get-product.yaml

extra:
  python:
    source: provider/shopify-tools.py
